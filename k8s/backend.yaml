apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-app-be
  labels:
    app: kube-be
spec:
  selector:
    matchLabels:
      app: kube-be
  replicas: 1
  template:
    metadata:
      labels:
        app: kube-be
    spec:
      containers:
        - name: kube-be
          image: ghcr.io/pc-b/kube-be:main
          imagePullPolicy: Always
          resources:
            requests:
              cpu: 1
              memory: 512Mi
            limits:
              cpu: 2
              memory: 1Gi
          ports:
            - containerPort: 3000
          env:
            - name: DATABASE_URL
              value: postgres://user:password@postgres-service:5432/postgres
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3000
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
